# Fly.io 배포 설정 — backend 컨테이너
# 빌드 컨텍스트는 저장소 루트(pnpm 모노레포라 backend/Dockerfile이 루트 기준으로 COPY함)
app = "doc-nexus-backend"
primary_region = "nrt"

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "npx prisma migrate deploy"

[env]
  PORT = "8000"
  NODE_ENV = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "10s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
