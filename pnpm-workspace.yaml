packages:
  - 'frontend'
  - 'backend'

allowBuilds:
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  # 내 코어 패키지는 갓 publish 한 버전도 바로 받는다 — 버전마다 줄이 늘지 않게 패턴 한 줄로 둔다
  - '@leejinyoung-kr/*'
