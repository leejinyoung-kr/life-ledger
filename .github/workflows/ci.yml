name: CI

# 검사만 한다 — 배포는 main push 때 deploy-home-server.yml(self-hosted)이 따로 한다.
# 작업은 develop 에 push 한 뒤 main 으로 fast-forward 하므로 PR 이 없을 때가 많다 → develop push 도 같이 건다
on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR 은 새 push 가 오면 앞 검사를 취소한다 — develop push 는 커밋마다 결과를 남긴다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      # setup-node 의 pnpm 캐시가 pnpm 을 찾으려면 먼저 켜 둬야 한다 (pace-log server-ci 와 같은 순서)
      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@leejinyoung-kr'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # lockfile 은 루트 하나(pnpm workspace) — 하위 폴더에서 돌려도 workspace 전체가 설치된다.
      # 코어 패키지는 young-core(비공개) 소유라 GITHUB_TOKEN 으로는 못 받는다 — 배포와 같은 PAT secret.
      # public 레포라 포크에서 온 PR 에는 secret 이 넘어가지 않아 이 단계에서 실패한다
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # 생성된 클라이언트 타입이 있어야 lint(타입 정보)·test 가 돈다. DB 에 붙지 않으니 주소는 더미값
      - run: pnpm exec prisma generate
        env:
          DATABASE_URL: mysql://ci:ci@localhost:3306/ci

      # package.json 의 lint 스크립트는 --fix 가 붙어 있어 CI 에서 고친 채 통과해 버린다 — 고치지 않고 검사만 한다.
      # 2026-10-18 기준 1,996건(서식 1,049 · spec 의 any mock 715 등)이 남아 있어 아직은 결과만 보이고 막지 않는다.
      # 정리한 뒤 continue-on-error 를 지운다 (docs/test-audit.md)
      - run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      # nest build 는 SWC 라 타입 검사를 하지 않는다 — lint 가 막지 않는 동안 타입 오류는 여기서 막는다
      - run: pnpm exec tsc --noEmit

      - run: pnpm build

      - run: pnpm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://npm.pkg.github.com
          scope: '@leejinyoung-kr'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # frontend 는 코어 패키지를 쓰지 않지만 workspace 설치라 backend 의존성까지 받는다 — 그래서 같은 secret 이 필요하다
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - run: pnpm lint

      # NEXT_PUBLIC_* 는 코드에 localhost 기본값이 있어 빌드에 값이 필요 없다 — 검사용 빌드라 넣지 않는다
      - run: pnpm build

      - run: pnpm test
