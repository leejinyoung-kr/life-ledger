name: Deploy Home Server

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - 'docker-compose.demo.yml'
      - 'tailscale/**'
      - '.github/workflows/deploy-home-server.yml'
  # 코드 변경 없이 서버 .env 만 바꿨을 때(암호화 키 교체 등) 같은 점검을 거쳐 다시 배포한다.
  # 수동 실행은 before 가 없어 diff 가 비므로 backend·frontend 를 둘 다 빌드한다
  workflow_dispatch:

# 실행을 통째로 하나씩 차례로 돌린다 — 뒤 push 의 검사가 먼저 끝나 앞 push 가 옛 커밋으로 되돌려 배포하는 일을 막는다
concurrency:
  group: deploy-home-server
  cancel-in-progress: false

jobs:
  # 검사는 GitHub 러너에서 ci.yml 을 그대로 부른다 — 통과해야 배포한다 (테스트는 이미지 빌드에서 돌지 않는다, infra ADR 0009)
  check:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    needs: [check]
    # 수동 실행을 다른 브랜치에서 하면 그 브랜치가 배포되므로 main 만 받는다
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted]
    steps:
      # actions/checkout을 쓰지 않고 러너가 이미 갖고 있는 ~/apps/life-ledger 클론을 그대로 갱신한다.
      # .env / backend/.env 는 git에 커밋되지 않으므로, fresh checkout을 쓰면 이 파일들이 사라진다.
      # origin/main 이 아니라 검사를 통과한 이 커밋으로 맞춘다 — 그사이 올라온 검사 전 커밋을 빌드하지 않게
      - name: Pull latest
        run: |
          cd ~/apps/life-ledger
          git fetch origin main
          git reset --hard "$GITHUB_SHA"

      # 홈서버에 배포하는 레포가 여럿이어도 물리 서버는 하나라, 동시에 push되면 docker build가
      # 서로 CPU를 경합해서 오히려 더 느려질 수 있다. 홈서버 공통 잠금(/tmp/deploy.lock — infra README)으로
      # 배포가 한 번에 하나만 돌도록 강제한다.
      - name: Build and deploy
        run: |
          cd ~/apps/life-ledger
          (
            flock -x 200
            # 실제로 바뀐 경로만 보고 backend/frontend 중 필요한 서비스만 빌드한다.
            # diff 자체가 실패하면(첫 push 등) 안전하게 둘 다 빌드.
            # bash -e 라 diff 실패가 대입에서 스크립트를 끝내지 않도록 || true (수동 실행은 BEFORE_SHA 가 비어 git 이 128 로 실패)
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null || true)
            SERVICES=""
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(backend/|docker-compose\.yml)'; then
              SERVICES="$SERVICES backend"
            fi
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(frontend/|docker-compose\.yml)'; then
              SERVICES="$SERVICES frontend"
            fi
            echo "changed files: $CHANGED"
            echo "building services:$SERVICES"
            # 빌드된 커밋을 이미지에 넣는다 — /_meta 가 "지금 도는 것이 어느 코드인지" 보여준다.
            # 러너는 reset --hard 로 맞춘 클론이라 보통 깨끗하지만, 손댄 흔적이 있으면 -dirty 를 붙인다
            DIRTY=""
            git diff --quiet HEAD -- || DIRTY="-dirty"
            export GIT_COMMIT="$(git rev-parse --short=12 HEAD)$DIRTY"
            echo "build commit: $GIT_COMMIT"
            docker compose build $SERVICES
            # 새 이미지로 환경변수(backend/.env + compose environment)와 암호화 키 설정만 먼저 검증한다(DB 안 봄).
            # 새 코드가 요구하는 키가 서버 .env 에 없으면 여기서 틀린 키 목록과 함께 실패하고,
            # 아래 up -d 까지 가지 않으므로 기존 컨테이너가 그대로 서비스를 계속한다.
            docker compose run --rm --no-deps backend node dist/config/check-env.js
            # 컨테이너를 띄우기 전에 새 이미지로 1회성 컨테이너를 만들어 마이그레이션부터 적용한다.
            # docker compose run은 서비스에 정의된 environment/networks를 그대로 물려받아
            # infra 의 mariadb로 정상 접속되고, 실행 후 자동 종료(--rm)되어 실제 서비스에는 영향 없다.
            # backend를 안 빌드한 경우에도 스키마 확인 차원에서 매번 실행 (변경 없으면 즉시 끝남).
            docker compose run --rm backend npx prisma migrate deploy
            # 새 이미지의 키 설정(CRYPTO_KEYS·CREDENTIAL_SECRET)으로 DB 의 암호문을 전부 복호화해 본다(읽기만).
            # 이전 키를 너무 일찍 뺐거나 시크릿을 잘못 넣었으면 여기서 멈춰 기존 컨테이너가 계속 서비스한다.
            # 재암호화는 하지 않는다 — 기존 컨테이너가 새 포맷을 못 읽을 수 있어서, 새 컨테이너가 부팅하며 한다
            docker compose run --rm backend node dist/crypto/crypto-check.js
            docker compose up -d
            # 새 backend 가 healthy 가 될 때까지(부팅 시 재암호화는 listen 전에 끝난다) 기다린 뒤,
            # 암호문 상태를 다시 점검해 배포 로그에 남긴다 — 키별 건수로 재암호화 결과가 보인다
            for i in $(seq 1 36); do
              STATUS=$(docker inspect -f '{{.State.Health.Status}}' "$(docker compose ps -q backend)")
              [ "$STATUS" = healthy ] && break
              sleep 5
            done
            echo "backend health: $STATUS"
            [ "$STATUS" = healthy ] || { docker compose logs --tail 80 backend; exit 1; }
            docker compose run --rm backend node dist/crypto/crypto-check.js
            docker compose ps
          ) 200>/tmp/deploy.lock
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}

      # 데모 인스턴스(docker-compose.demo.yml) — 홈서버에 .env.demo 가 있을 때만 같은 코드로 다시 띄운다.
      # 운영 배포가 끝난 뒤라 여기서 실패해도 운영은 이미 새 버전으로 떠 있다. 데모 프론트는 NEXT_PUBLIC_DEMO_MODE 가 달라 따로 빌드된다
      - name: Deploy demo
        run: |
          cd ~/apps/life-ledger
          if [ ! -f .env.demo ] || [ ! -f backend/.env.demo ]; then
            echo "데모 env 없음 — 건너뜀"
            exit 0
          fi
          (
            flock -x 200
            export GIT_COMMIT="$(git rev-parse --short=12 HEAD)"
            DEMO="docker compose -p life-ledger-demo --env-file .env.demo -f docker-compose.yml -f docker-compose.demo.yml"
            $DEMO build backend frontend
            $DEMO run --rm --no-deps backend node dist/config/check-env.js
            $DEMO run --rm backend npx prisma migrate deploy
            $DEMO up -d
            $DEMO ps
          ) 200>/tmp/deploy.lock
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      # 빌드 캐시·옛 이미지가 배포마다 쌓여 디스크를 채운다(2026-10-16 캐시만 165G — infra README).
      # 캐시는 최근 것 20GB 만 남기고, 태그가 넘어가 이름 없이 남은 이미지는 지운다. 다른 앱 빌드와 겹치지 않게 같은 잠금 안에서 한다
      - name: Clean up docker
        run: |
          (
            flock -x 200
            docker builder prune -f --max-used-space 20GB
            docker image prune -f
          ) 200>/tmp/deploy.lock
