name: Deploy Home Server

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-home-server.yml'

jobs:
  deploy:
    runs-on: [self-hosted]
    concurrency: deploy-home-server
    steps:
      # actions/checkout을 쓰지 않고 러너가 이미 갖고 있는 ~/doc-nexus 클론을 그대로 갱신한다.
      # .env / backend/.env 는 git에 커밋되지 않으므로, fresh checkout을 쓰면 이 파일들이 사라진다.
      - name: Pull latest
        run: |
          cd ~/doc-nexus
          git fetch origin develop
          git reset --hard origin/develop

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install and verify
        run: |
          cd ~/doc-nexus
          pnpm install --frozen-lockfile
          pnpm --filter backend exec prisma generate
          pnpm --filter backend test
          pnpm --filter frontend lint
          pnpm --filter frontend test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Build and deploy
        run: |
          cd ~/doc-nexus
          docker compose build
          docker compose up -d
          docker compose ps
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
