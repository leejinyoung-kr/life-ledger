name: Deploy Home Server

on:
  push:
    branches: [develop]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docker-compose.yml'
      - '.github/workflows/deploy-home-server.yml'

jobs:
  deploy:
    runs-on: [self-hosted]
    concurrency: deploy-home-server
    steps:
      # actions/checkout을 쓰지 않고 러너가 이미 갖고 있는 ~/nexus-family/doc-nexus 클론을 그대로 갱신한다.
      # .env / backend/.env 는 git에 커밋되지 않으므로, fresh checkout을 쓰면 이 파일들이 사라진다.
      - name: Pull latest
        run: |
          cd ~/nexus-family/doc-nexus
          git fetch origin develop
          git reset --hard origin/develop

      # nexus 패밀리(doc-nexus/work-nexus/nexus-devops-agent)가 레포별로 별도 self-hosted 러너를
      # 쓰지만 실제로는 같은 물리 홈서버라, 여러 레포가 동시에 push되면 docker build가 서로 CPU를
      # 경합해서 오히려 더 느려진다. flock으로 홈서버 전체에서 배포가 한 번에 하나만 돌도록 강제한다.
      - name: Build and deploy
        run: |
          cd ~/nexus-family/doc-nexus
          (
            flock -x 200
            # 실제로 바뀐 경로만 보고 backend/frontend 중 필요한 서비스만 빌드한다.
            # diff 자체가 실패하면(첫 push 등) 안전하게 둘 다 빌드.
            CHANGED=$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" 2>/dev/null)
            SERVICES=""
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(backend/|docker-compose\.yml)'; then
              SERVICES="$SERVICES backend"
            fi
            if [ -z "$CHANGED" ] || echo "$CHANGED" | grep -qE '^(frontend/|docker-compose\.yml)'; then
              SERVICES="$SERVICES frontend"
            fi
            echo "changed files: $CHANGED"
            echo "building services:$SERVICES"
            docker compose build $SERVICES
            # 컨테이너를 띄우기 전에 새 이미지로 1회성 컨테이너를 만들어 마이그레이션부터 적용한다.
            # docker compose run은 서비스에 정의된 environment/networks를 그대로 물려받아
            # nexus-db로 정상 접속되고, 실행 후 자동 종료(--rm)되어 실제 서비스에는 영향 없다.
            # backend를 안 빌드한 경우에도 스키마 확인 차원에서 매번 실행 (변경 없으면 즉시 끝남).
            docker compose run --rm backend npx prisma migrate deploy
            docker compose up -d
            docker compose ps
          ) 200>/tmp/nexus-deploy.lock
        env:
          NPM_READ_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
