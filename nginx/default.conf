# 앞단 Nginx — 사이드카(길 · 주소 · 인증서) 뒤에서 / 는 frontend, /api 는 backend 로 나눈다 (ADR 0010)
# 이미지 기본 nginx.conf 의 http { include conf.d/*.conf } 안에 들어간다

# 도커 내장 DNS — 컨테이너가 다시 만들어져 IP 가 바뀌어도 10초 안에 새 주소를 쓴다 (proxy_pass 를 변수로 쓰는 이유)
resolver 127.0.0.11 valid=10s ipv6=off;

# 로그인 · 인증코드 경로의 횟수 제한 — 손님 IP(아래 real_ip 로 바꾼 값)마다 분당 20회.
# 백엔드 throttler(분당 5 ~ 10회)보다 넉넉하게 두어, 평소엔 백엔드가 막고 Nginx 는 쏟아지는 요청만 막는다
limit_req_zone $binary_remote_addr zone=auth:1m rate=20r/m;
limit_req_status 429;

# 접속 로그 — 쿼리 문자열(OAuth code 등)은 남기지 않는다
log_format main_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time "$http_user_agent"';

server {
    listen 80;
    server_tokens off;
    access_log /dev/stdout main_noquery;

    # 진짜 IP — 사이드카(도커 네트워크 대역)가 보낸 X-Forwarded-For 만 믿는다. 사이드카는 이 값을 덮어써 보낸다
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    # 백엔드 업로드 한도 50MB(file.controller.ts MAX_UPLOAD_BYTES) + multipart 머리 몫. 기본 1MB 면 업로드가 413
    client_max_body_size 55m;

    # 응답을 기다리는 시간 — 기본 60초면 큰 ZIP 내보내기가 첫 바이트 전에 끊길 수 있다
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # 뒤로는 손님 IP 한 값만 넘긴다 — 백엔드 TRUST_PROXY=1 이 그대로 맞는다
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # API JSON 압축 — 화면(Next.js)은 스스로 압축해 보낸다
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Nginx 가 직접 막을 때도 화면이 읽는 { message } 모양으로 돌려준다
    error_page 413 = @too_large;
    error_page 429 = @too_many;

    location ~ ^/api/v1/auth/(email/|demo$) {
        limit_req zone=auth burst=10 nodelay;
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
        # 화면은 스트리밍으로 나눠 보내므로 모아 두지 않는다
        proxy_buffering off;
    }

    # 한글 본문이라 charset 을 붙인다 (기본 charset_types 에 application/json 이 없다)
    charset_types application/json;
    charset utf-8;

    location @too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"파일이 너무 큽니다. 50MB 이하로 올려 주세요."}';
    }

    location @too_many {
        default_type application/json;
        return 429 '{"statusCode":429,"message":"요청이 너무 많습니다. 잠시 뒤 다시 시도해 주세요."}';
    }
}

# 컨테이너 healthcheck 전용 — 루프백이라 사이드카로는 닿지 않는다
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /health {
        return 200 "ok\n";
    }
}
