# 홈서버 클론 경로: ~/nexus-family/doc-nexus (2026-08-02 폴더 재구성, deploy-home-server.yml 참고)
name: nexus-shared

services:
  db:
    image: mariadb:11
    # doc-nexus 전용이 아니라 Nexus 패밀리(doc-nexus/work-nexus 등)가 데이터베이스명만
    # 다르게(docnexus/worknexus) 공유하는 서버라 이름을 프로젝트 중립적으로 고정.
    container_name: nexus-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: docnexus
      TZ: Asia/Seoul
    command: --default-time-zone=+09:00
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      secrets:
        - npm_read_token
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: "mysql://root:${MARIADB_ROOT_PASSWORD}@db:3306/docnexus?timezone=+09:00"
      BACKUP_DIR: /app/backend/backups
    volumes:
      - db_backups:/app/backend/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      secrets:
        - npm_read_token
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  db_data:
  db_backups:

secrets:
  npm_read_token:
    environment: NPM_READ_TOKEN
