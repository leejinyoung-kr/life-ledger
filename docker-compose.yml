# 홈서버 클론 경로: ~/apps/doc-nexus (deploy-home-server.yml 참고)
# DB 는 infra 레포의 공용 MariaDB 다 — infra 를 먼저 띄운다(외부 네트워크 infra, 호스트 이름 mariadb)
name: doc-nexus

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 배포 워크플로가 넣어 준다(로컬 빌드는 비어 있고 /_meta 에 unknown 으로 나온다)
        GIT_COMMIT: ${GIT_COMMIT:-}
      secrets:
        - npm_read_token
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000" # 루프백만 — 외부는 아래 tailscale 사이드카(/api)로만 들어온다
    env_file:
      - backend/.env
    environment:
      # backend/.env 는 호스트 기준(localhost:13306)이라 컨테이너 값으로 덮는다. 전용 사용자 docnexus — 비밀번호는 infra/.env 의 DOCNEXUS_DB_PASSWORD
      DATABASE_URL: "mysql://docnexus:${DB_PASSWORD}@mariadb:3306/docnexus?timezone=+09:00"
      BACKUP_DIR: /app/backend/backups
    volumes:
      - db_backups:/app/backend/backups
    networks:
      - default
      - infra
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      secrets:
        - npm_read_token
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000" # 루프백만 — 외부는 아래 tailscale 사이드카(/)로만 들어온다
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 홈서버 외부 접속 — 앱 전용 Tailscale 노드 docnexus 가 Funnel 로 / 는 frontend, /api 는 backend 로 보낸다
  # (같은 origin 이라 NEXT_PUBLIC_* 과 backend 의 FRONTEND_URL·CORS_ORIGINS 가 한 주소다. infra README "외부 접속")
  tailscale:
    image: tailscale/tailscale:stable
    profiles: [homeserver]
    restart: unless-stopped
    environment:
      TS_HOSTNAME: docnexus
      # 처음 붙을 때만 쓴다 — 그 뒤로는 tailscale_state 볼륨의 노드 정보로 붙는다 (태그 tag:app 이 달린 키)
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale/serve.json:/config/serve.json:ro
    depends_on:
      frontend:
        condition: service_healthy

networks:
  infra:
    external: true

volumes:
  db_backups:
  tailscale_state:

secrets:
  npm_read_token:
    environment: NPM_READ_TOKEN
